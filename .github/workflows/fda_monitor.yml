name: FDA新药监控

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13-22 * * 1-5'

permissions:
  contents: write

jobs:
  run_script:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        id: checkout
        uses: actions/checkout@v4

      - name: 安装环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库
        run: |
          pip install requests beautifulsoup4 yfinance feedparser deep-translator pytz

      - name: 执行监控脚本
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python fda_monitor.py

      - name: 保存运行记录
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          touch last_fda_ids.txt last_success_date_drug.txt

          git add last_fda_ids.txt last_success_date_drug.txt

          if ! git diff --cached --quiet; then
            git commit -m "更新FDA记录及状态 [$(date +'%Y-%m-%d %H:%M')]"
          else
            echo "No changes to commit"
          fi

          git pull origin main --rebase
          git push

      - name: 失败通知
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          IFS=',' read -ra CHAT_IDS <<< "$TG_CHAT_ID"

          MESSAGE="❌ GitHub Actions 执行失败%0AWorkflow: ${WORKFLOW_NAME}%0ARun: #${RUN_NUMBER}%0A请前往 GitHub Actions 手动检查运行记录。"

          for CHAT_ID in "${CHAT_IDS[@]}"; do
            CHAT_ID=$(echo "$CHAT_ID" | xargs)
            [ -z "$CHAT_ID" ] && continue

            curl --silent --show-error --output /dev/null \
              --fail --max-time 20 \
              -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              --data-urlencode "text=$(echo -e "$MESSAGE" | sed 's/%0A/\n/g')" \
              || true
          done
